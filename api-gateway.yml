server:
  port: 8989

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Customer Swagger
            - id: customer-swagger
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customer/v3/api-docs
              filters:
                - StripPrefix=1

            # Consumer Swagger
            - id: consumer-swagger
              uri: lb://CONSUMER-SERVICE
              predicates:
                - Path=/consumer/v3/api-docs
              filters:
                - StripPrefix=1
            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customers/**

            - id: consumer-service
              uri: lb://CONSUMER-SERVICE
              predicates:
                - Path=/consumer/**

springdoc:
  swagger-ui:
    urls:
      - name: Customer Service
        url: /customer/v3/api-docs
      - name: Consumer Service
        url: /consumer/v3/api-docs
      - name: API Gateway
        url: /v3/api-docs
    urls-primary-name: Customer Service
    
    
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    